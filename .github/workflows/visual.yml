name: Visual QA
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      REQUIRE_PHOTO_ASSETS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm install --no-audit --no-fund
      - run: npm test && npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Dependency audit evidence
        run: |
          mkdir -p qa
          npm audit --json > qa/npm-audit.json || true
      - run: |
          npm run preview > /tmp/dream-city.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:4173/ && break; sleep 1; done
          EXPECT_BUILD_SHA="$GITHUB_SHA" node tests/browser.mjs
      - name: Security gate (high or critical)
        if: always()
        run: npm audit --audit-level=high
      - name: Production browser QA (exact build SHA)
        if: github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://dream-city-lime.vercel.app/
          QA_DIR: qa/production
        run: EXPECT_BUILD_SHA="$GITHUB_SHA" node tests/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dream-city-render-captures
          path: qa/
          if-no-files-found: ignore
